<!-- Pixel-grid 16px icon for the smallest .ico entry: the selected cell,
     reduced to a one-pixel selection border and its handle, which is all
     that survives at this size. Heavier strokes fill in to a blob. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#ffffff"/>
  <rect x="0" y="0" width="16" height="2" fill="#185c37"/>
  <g fill="#e6e9ec">
    <rect x="0" y="9" width="16" height="1"/>
    <rect x="12" y="2" width="1" height="14"/>
  </g>
  <g fill="#217346">
    <rect x="3" y="5" width="8" height="1"/>
    <rect x="3" y="12" width="8" height="1"/>
    <rect x="3" y="5" width="1" height="8"/>
    <rect x="10" y="5" width="1" height="8"/>
  </g>
  <rect x="10" y="12" width="2" height="2" fill="#217346"/>
</svg>
