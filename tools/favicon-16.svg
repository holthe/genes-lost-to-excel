<!-- Pixel-grid 16px icon, used only for the smallest favicon.ico entry.
     The same memorial cell as favicon.svg, redrawn on a 16 grid with
     1px rects so the table lines land on pixels instead of antialiasing
     into fog. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#101114"/>
  <g fill="#c3ab77">
    <rect x="1" y="3" width="14" height="1"/>
    <rect x="1" y="12" width="14" height="1"/>
    <rect x="1" y="3" width="1" height="10"/>
    <rect x="14" y="3" width="1" height="10"/>
    <rect x="1" y="6" width="14" height="1"/>
    <rect x="6" y="3" width="1" height="10"/>
  </g>
  <rect x="7" y="7" width="7" height="5" fill="#b3985a"/>
</svg>
