<!DOCTYPE html>
<!--
  Source for /og.png (1200x630). Rendered by `make og`.
  Edit the copy here, not the PNG. Regenerate after any tagline change.
  The domain in the footer is the production-domain placeholder; if the
  site lands somewhere other than geneslosttoexcel.org, change it here too.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #101114;
    color: #d9d6cd;
    font-family: Georgia, serif;
    display: flex; flex-direction: column; text-align: center;
  }
  .mid {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 0 80px;
  }
  .eyebrow {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; letter-spacing: 0.3em; text-transform: uppercase;
    color: #b3985a;
  }
  .goldrule {
    display: flex; align-items: center; gap: 14px; margin: 26px 0 34px;
  }
  .goldrule i { display: block; height: 1px; width: 150px;
    background: linear-gradient(90deg, transparent, rgba(201,179,128,.55)); }
  .goldrule i + i {
    background: linear-gradient(90deg, rgba(201,179,128,.55), transparent); }
  .goldrule b { width: 8px; height: 8px; background: rgba(201,179,128,.7);
    transform: rotate(45deg); }
  h1 { font-size: 66px; font-weight: 400; line-height: 1.15; max-width: 1000px; }
  .inscr {
    margin-top: 34px; font-size: 26px; letter-spacing: 0.18em; color: #c3ab77;
    text-shadow: 0 -1px 0 rgba(0,0,0,.95), 0 1px 1px rgba(255,255,255,.07);
  }
  .inscr span { color: rgba(201,179,128,.4); padding: 0 .15em; }
  .foot {
    flex: none;
    padding: 0 72px 30px;
    display: flex; justify-content: space-between;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; color: #8a8779;
    text-transform: uppercase; letter-spacing: 0.14em;
  }
</style>
</head>
<body>
  <div class="mid">
    <div class="eyebrow">Sites of Remembrance</div>
    <div class="goldrule"><i></i><b></b><i></i></div>
    <h1>Memorial for the<br>Genes Lost to Excel</h1>
    <p class="inscr">SEPT1 <span>&#183;</span> MARCH1 <span>&#183;</span> DEC1</p>
  </div>
  <div class="foot">
    <span>DOC: BEI-011</span>
    <span>GENESLOSTTOEXCEL.ORG</span>
    <span>Lest we forget, or reformat</span>
  </div>
</body>
</html>
