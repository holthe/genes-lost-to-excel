<!-- Source for assets/logo.svg. Text is still live here; `make logo` runs
     Inkscape with export-text-to-path so the committed logo does not depend
     on the viewer's fonts. The wordmark is set in Georgia, which is
     installed on this machine (see the README's font note). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-label="Memorial for the Genes Lost to Excel">
  <rect width="1240" height="400" fill="#101114"/>
  <text x="620" y="86" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="7" fill="#b3985a">SITES OF REMEMBRANCE</text>
  <g stroke="#c9b380" stroke-opacity="0.5" stroke-width="1">
    <line x1="420" y1="118" x2="590" y2="118"/>
    <line x1="650" y1="118" x2="820" y2="118"/>
  </g>
  <rect x="615" y="113" width="9" height="9" transform="rotate(45 619.5 117.5)" fill="#c9b380" fill-opacity="0.65"/>
  <text x="620" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#d9d6cd">Memorial for the Genes Lost to Excel</text>
  <text x="620" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="6" fill="#c3ab77">SEPT1 &#183; MARCH1 &#183; DEC1</text>
  <text x="620" y="352" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="19" letter-spacing="6" fill="#8a8779">LEST WE FORGET, OR REFORMAT</text>
</svg>
