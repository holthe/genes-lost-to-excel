<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <title>Memorial for the Genes Lost to Excel</title>
  <!-- A selected cell on a worksheet: the grid, the green selection border
       and its fill handle. The cell it holds is the one that was lost. -->
  <rect width="64" height="64" fill="#ffffff"/>
  <g fill="#e6e9ec">
    <rect x="0" y="15" width="64" height="1"/>
    <rect x="0" y="31" width="64" height="1"/>
    <rect x="0" y="47" width="64" height="1"/>
    <rect x="15" y="0" width="1" height="64"/>
    <rect x="47" y="0" width="1" height="64"/>
  </g>
  <rect x="0" y="0" width="64" height="10" fill="#185c37"/>
  <g fill="none" stroke="#217346" stroke-width="4">
    <rect x="16" y="17" width="32" height="30"/>
  </g>
  <rect x="43" y="42" width="10" height="10" fill="#217346" stroke="#ffffff" stroke-width="2"/>
</svg>
